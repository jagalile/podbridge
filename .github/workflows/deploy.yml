name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # El frontend es estático y vive en la raíz del repo, así que se
          # publica el repo entero tal cual (sin build) — incluye también
          # /worker y /relay-service, que no forman parte del sitio en sí
          # pero no tiene nada sensible: es el mismo código fuente que ya
          # es público en este repositorio.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
